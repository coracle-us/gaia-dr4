[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "companions"
version = "0.1.0"
description = "Gaia DR4 epoch-astrometry orbit fitting for companions to transiting giant-planet hosts"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["companions"]
